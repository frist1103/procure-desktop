<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e3e7ee;
    --brand: #1f4e8c; --brand-soft: #e8eef7; --ok: #1e7b4a; --warn: #a15c00; --bad: #b42318;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 'Sarabun', system-ui, sans-serif; }
  h2, h3 { margin: 0 0 10px; }
  h3 { font-size: 16px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; background: var(--brand); color: #fff; }
  .brand-name { font-weight: 700; font-size: 18px; }
  .brand-sub { font-size: 12px; opacity: .8; }
  .who { font-size: 13px; text-align: right; }
  .who .chip { background: rgba(255,255,255,.18); color: #fff; }
  .nav { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--brand); }
  .nav button { background: transparent; border: 0; color: #dfe7f3; padding: 8px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font: inherit; }
  .nav button.on { background: var(--bg); color: var(--ink); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card.warn { border-color: #f3c27a; background: #fff8ec; }
  .grid { display: grid; gap: 14px; }
  .grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .stat .n { font-size: 26px; font-weight: 700; color: var(--brand); }
  .stat .l { color: var(--muted); font-size: 13px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .chip { display: inline-block; padding: 1px 9px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: 12px; margin: 2px 3px 2px 0; }
  .chip.dev { background: #fff1d6; color: var(--warn); }
  .perf div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 4px 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 14px; cursor: pointer; font: inherit; }
  .tabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; margin-bottom: 6px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .tablewrap { overflow-x: auto; }
  #perf-out td:nth-child(n+2), #perf-out th:nth-child(n+2) { text-align: right; white-space: nowrap; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f8f9fb; position: sticky; top: 0; font-weight: 600; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #f3f6fb; }
  .form { display: grid; gap: 10px; max-width: 560px; }
  .form.cols { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); max-width: none; }
  .form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .form input, .sig-row input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; color: var(--ink); }
  label.inline { display: inline-flex !important; align-items: center; gap: 6px; color: var(--ink) !important; font-size: 14px !important; margin-right: 14px; }
  .roles { display: flex; flex-wrap: wrap; gap: 4px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; }
  .actions button, .tool button, .sig-row button { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  button:disabled { opacity: .55; cursor: wait; }
  .sig-row { display: grid; grid-template-columns: 200px 1fr 200px auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .preview { background: #f8f9fb; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
  .preview div { padding: 2px 0; }
  .tool { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .loading { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 60px 0; color: var(--muted); }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d2433; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; max-width: 90vw; z-index: 10; }
  .toast.bad { background: var(--bad); }
  @media (max-width: 640px) {
    .top { flex-direction: column; align-items: flex-start; }
    .who { text-align: left; }
    .sig-row { grid-template-columns: 1fr; }
  }
</style>
