<script>
/* ProcUI — หน้างานจัดซื้อ (เฟส 2): รายการงาน + ฟอร์ม 5 ขั้น
 * ใช้เครื่องมือจาก Client (window.App) และข้อมูลอ้างอิงที่แคชไว้ในเครื่องสำหรับช่องค้นหา */
(function () {
  'use strict';
  var A = window.App, $ = A.$, esc = A.esc, run = A.run, toast = A.toast;
  var META = null, LIST = null, LISTFY = '', FILTER = 'active', QUERY = '';
  var E = null; // งานที่เปิดอยู่

  // ================================================================ เครื่องมือ
  var MONF = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var DOW = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  function ref(t) { return A.rowsOf(A.S.ref[t]); }
  function cfg() { return A.S.ref.config || {}; }
  function canWrite() { return A.has('officer') || A.has('head') || A.has('admin'); }
  function nz(v) { return !(v === null || v === undefined || String(v).trim() === ''); }
  function num(v) { var n = Number(String(v === undefined || v === null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  function r2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
  function money(n) { var x = r2(n).toFixed(2).split('.'); return x[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + x[1]; }
  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function parseIso(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function addDays(s, n) { var d = parseIso(s); if (!d) return ''; d.setDate(d.getDate() + Number(n)); return iso(d); }
  function thDate(s, withDow) {
    var d = parseIso(s); if (!d) return '';
    return (withDow ? 'วัน' + DOW[d.getDay()] + 'ที่ ' : '') + d.getDate() + ' ' + MONF[d.getMonth()] + ' ' + (d.getFullYear() + 543);
  }
  function fyOf(s) { var d = parseIso(s); return d ? d.getFullYear() + 543 + (d.getMonth() >= 9 ? 1 : 0) : ''; }
  function quarterOf(s) { var d = parseIso(s); if (!d) return ''; var m = d.getMonth() + 1; return m >= 10 ? 1 : (m <= 3 ? 2 : (m <= 6 ? 3 : 4)); }
  var TN = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], TP = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  function grp(n, hi) {
    var s = String(n), o = '';
    for (var i = 0; i < s.length; i++) {
      var d = +s.charAt(i), p = s.length - i - 1;
      if (!d) continue;
      if (p === 1 && d === 1) o += 'สิบ'; else if (p === 1 && d === 2) o += 'ยี่สิบ';
      else if (p === 0 && d === 1 && (s.length > 1 || hi)) o += 'เอ็ด'; else o += TN[d] + TP[p];
    }
    return o;
  }
  function readNum(n) { n = Math.floor(n); if (!n) return 'ศูนย์'; var mi = Math.floor(n / 1e6), r = n % 1e6; return (mi ? readNum(mi) + 'ล้าน' : '') + (r ? grp(r, mi > 0) : ''); }
  function bahtText(a) {
    var v = r2(a); if (!v) return 'ศูนย์บาทถ้วน';
    var b = Math.floor(v), s = Math.round((v - b) * 100);
    return (b ? readNum(b) + 'บาท' : '') + (s ? readNum(s) + 'สตางค์' : 'ถ้วน');
  }
  function stChip(st) { return '<span class="st st-' + esc(st) + '">' + esc((META && META.status[st]) || st) + '</span>'; }
  function docNo(p) { return p.proc_no ? p.proc_no + '/' + p.fiscal_year : ''; }
  function personName(id) { var p = ref('personnel').filter(function (x) { return x.person_id === id; })[0]; return p ? p.full_name : ''; }
  function shortDept(n) { return String(n || '').replace(/^กลุ่มบริหารงาน|^กลุ่มสาระการเรียนรู้/, '').trim(); }
  function personPos(id) { var p = ref('personnel').filter(function (x) { return x.person_id === id; })[0]; return p ? (p.position_title || p.staff_type || '') : ''; }

  // ---------- กล่องโต้ตอบ (แทน alert/confirm ของเบราว์เซอร์) ----------
  function modal(o) {
    return new Promise(function (resolve) {
      var bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true"><h3>' + esc(o.title) + '</h3><div class="body">' + (o.html || '') +
        '</div><div class="merr" role="alert" hidden></div><div class="btns">' + (o.buttons || [{ label: 'ตกลง', value: true, cls: 'primary' }]).map(function (b, i) {
          return '<button class="btn ' + (b.cls || '') + '" data-i="' + i + '">' + esc(b.label) + '</button>';
        }).join('') + '</div></div>';
      document.body.appendChild(bg);
      var working = false;
      var close = function (v) { document.removeEventListener('keydown', key); bg.remove(); resolve(v); };
      var key = function (e) { if (e.key === 'Escape' && !working) close(null); };
      document.addEventListener('keydown', key);
      var btns = function (on) { Array.prototype.forEach.call(bg.querySelectorAll('.btns button'), function (x) { x.disabled = !on; }); };
      bg.addEventListener('click', function (e) {
        if (working) return;
        // กล่องที่มีช่องกรอก: คลิกนอกกล่องไม่ปิด (กันข้อมูลที่พิมพ์หาย)
        if (e.target === bg) { if (!o.collect) close(null); return; }
        var b = e.target.closest('.btns button'); if (!b) return;
        var def = (o.buttons || [{ value: true }])[Number(b.getAttribute('data-i'))];
        var val = def.value;
        if (o.collect && val) {
          modalErr(bg, '');
          var c = o.collect(bg);
          if (c && typeof c.then === 'function') {
            // บันทึกแบบรอผล: กล่องเปิดค้างจนบันทึกสำเร็จ ถ้าไม่สำเร็จแสดงข้อความในกล่อง ข้อมูลไม่หาย
            working = true; btns(false); b.setAttribute('data-label', b.textContent); b.textContent = 'กำลังบันทึก…';
            c.then(function (r) {
              working = false; btns(true); b.textContent = b.getAttribute('data-label');
              if (r !== false) close(r === undefined ? val : r);
            }, function (err) {
              working = false; btns(true); b.textContent = b.getAttribute('data-label');
              modalErr(bg, err && err.message ? err.message : String(err));
            });
            return;
          }
          if (c === false) return;
          val = c === undefined ? val : c;
        }
        close(val);
      });
      if (o.onOpen) o.onOpen(bg);
      var f = bg.querySelector('input,textarea,select,.btns .primary'); if (f) f.focus();
    });
  }
  /** ข้อความผิดพลาดในกล่องโต้ตอบ (ว่าง = ซ่อน) */
  function modalErr(bg, msg) {
    var el = bg.querySelector('.merr'); if (!el) return;
    el.textContent = msg || ''; el.hidden = !msg;
    if (msg) el.scrollIntoView({ block: 'nearest' });
  }
  var busyEl = null;
  function busyOn(msg, sub) {
    busyOff();
    busyEl = document.createElement('div'); busyEl.className = 'busy-bg';
    busyEl.innerHTML = '<div><div class="spinner" style="margin:auto"></div><div class="msg">' + esc(msg) + '</div><div class="sub">' + esc(sub || '') + '</div></div>';
    document.body.appendChild(busyEl);
  }
  function busyOff() { if (busyEl) { busyEl.remove(); busyEl = null; } }

  // ---------- ช่องค้นหา (พิมพ์แล้วเลือก) ----------
  function combo(input, o) {
    var wrap = input.parentNode;
    if (!wrap.classList.contains('combo')) { var w = document.createElement('div'); w.className = 'combo'; input.parentNode.insertBefore(w, input); w.appendChild(input); wrap = w; }
    var list = null, hits = [], cur = -1;
    function hide() { if (list) { list.remove(); list = null; } cur = -1; }
    function show() {
      var q = input.value.trim().toLowerCase();
      var words = q.split(/\s+/).filter(String);
      // จัดลำดับ: ชื่อที่ขึ้นต้นด้วยคำค้นมาก่อน แล้วตามตำแหน่งที่พบ
      hits = o.source().map(function (it) {
        var name = o.text(it).toLowerCase();
        var hay = (name + ' ' + (o.sub ? o.sub(it) : '') + ' ' + (o.extra ? o.extra(it) : '')).toLowerCase();
        if (!words.every(function (w) { return hay.indexOf(w) >= 0; })) return null;
        var p = words.length ? name.indexOf(words[0]) : 0;
        return { it: it, s: p < 0 ? 999 : p };
      }).filter(Boolean).sort(function (a, b) { return a.s - b.s; }).slice(0, 8).map(function (x) { return x.it; });
      if (!hits.length && o.hideEmpty) { hide(); return; }
      if (!list) { list = document.createElement('div'); list.className = 'combo-list'; wrap.appendChild(list); }
      list.innerHTML = hits.length ? hits.map(function (it, i) {
        return '<div data-i="' + i + '"' + (i === cur ? ' class="on"' : '') + '>' + esc(o.text(it)) + (o.sub ? '<small>' + esc(o.sub(it)) + '</small>' : '') + '</div>';
      }).join('') : '<div class="none">' + esc(o.empty || 'ไม่พบ — พิมพ์ต่อได้เลย') + '</div>';
    }
    function pick(i) { var it = hits[i]; if (!it) return; hide(); o.onPick(it); }
    input.setAttribute('autocomplete', 'off');
    input.addEventListener('focus', function () { if (!input.readOnly && !input.disabled) show(); });
    input.addEventListener('input', function () { cur = -1; show(); });
    input.addEventListener('blur', function () { setTimeout(hide, 150); });
    input.addEventListener('keydown', function (e) {
      if (!list) return;
      if (e.key === 'ArrowDown') { cur = Math.min(cur + 1, hits.length - 1); show(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { cur = Math.max(cur - 1, 0); show(); e.preventDefault(); }
      else if (e.key === 'Enter' && cur >= 0) { pick(cur); e.preventDefault(); }
      else if (e.key === 'Escape') hide();
    });
    wrap.addEventListener('mousedown', function (e) { var d = e.target.closest('.combo-list [data-i]'); if (d) { e.preventDefault(); pick(Number(d.getAttribute('data-i'))); } });
  }

  // ================================================================ หน้ารายการงาน
  // ---------- เก็บข้อมูลไว้ในเครื่อง (เฉพาะเจ้าหน้าที่) เพื่อเปิดได้ทันที แล้วค่อยตรวจกับเซิร์ฟเวอร์เบื้องหลัง ----------
  var idb = A.idb;
  function keep() { return canWrite(); }
  function metaOk() { return !!META && (!A.S.appVersion || META.version === A.S.appVersion); }
  function ensureMeta() {
    if (metaOk()) return Promise.resolve(META);
    return run('apiProcMeta').then(function (m) { META = m; if (keep()) idb.set('proc:meta', m); return m; });
  }
  function cacheJob(J) {
    if (!keep() || !J || J.isNew || !J.data.proc.proc_id) return;
    if (J.dirty || J.stale) return; // เก็บเฉพาะข้อมูลที่ตรงกับเซิร์ฟเวอร์
    var id = J.data.proc.proc_id;
    idb.set('proc:job:' + id, { data: J.data, docs: J.docs, canEdit: J.canEdit, canVoid: J.canVoid, folderUrl: J.folderUrl, rev: J.base, at: Date.now() });
    idb.get('proc:jobs').then(function (ids) {
      ids = (ids || []).filter(function (x) { return x !== id; }); ids.unshift(id);
      ids.slice(40).forEach(function (x) { idb.del('proc:job:' + x); }); // เก็บล่าสุด 40 งาน
      idb.set('proc:jobs', ids.slice(0, 40));
    });
  }
  function cacheList() { if (keep() && LIST) idb.set('proc:list', LIST); }
  function clearLocal() {
    return idb.get('proc:jobs').then(function (ids) {
      (ids || []).forEach(function (x) { idb.del('proc:job:' + x); });
      ['proc:jobs', 'proc:list', 'proc:meta'].forEach(function (k) { idb.del(k); });
    });
  }
  function show() {
    var root = $('page-proc');
    if (!root.innerHTML.trim()) root.innerHTML = '<div id="proc-list"></div><div id="proc-ed" hidden></div>';
    if (E) { $('proc-list').hidden = true; $('proc-ed').hidden = false; return; }
    $('proc-list').hidden = false; $('proc-ed').hidden = true;
    LISTFY = LISTFY || String(cfg().fiscal_year_current || '');
    if (LIST && META) { renderList(); refreshList(); return; }
    $('proc-list').innerHTML = '<div class="loading"><div class="spinner"></div><div>กำลังโหลดรายการงาน…</div></div>';
    (keep() ? Promise.all([idb.get('proc:list'), META ? META : idb.get('proc:meta')]) : Promise.resolve([null, null])).then(function (c) {
      if (!LIST && c[0] && c[0].rows) LIST = c[0];
      if (!META && c[1] && c[1].steps) META = c[1];
      if (LIST && META && !E) renderList();
      refreshList();
    });
  }
  /** โหลดรายการจากเซิร์ฟเวอร์ (พร้อมกฎของระบบถ้ายังไม่มี) แล้ววาดใหม่เฉพาะเมื่อข้อมูลเปลี่ยน */
  var listBusy = null;
  function refreshList() {
    if (listBusy) return listBusy;
    var shown = !!(LIST && META);
    if (shown) setListNote('กำลังอัปเดต…');
    listBusy = run('apiProcList', '', { meta: !metaOk() }).then(function (d) {
      listBusy = null;
      if (d.meta) { META = d.meta; if (keep()) idb.set('proc:meta', d.meta); }
      delete d.meta;
      var changed = JSON.stringify(d) !== JSON.stringify(LIST);
      LIST = d; cacheList();
      if (!E && $('proc-list') && !$('proc-list').hidden && (changed || !shown)) renderList(); else setListNote('');
    }).catch(function (e) {
      listBusy = null;
      if (!shown && !E) $('proc-list').innerHTML = '<div class="banner bad">' + esc(e.message) + '</div>';
      else { setListNote('อัปเดตไม่สำเร็จ — แสดงข้อมูลที่เก็บไว้'); toast(e.message, true); }
    });
    return listBusy;
  }
  function setListNote(t) { var el = $('p-note'); if (el) el.textContent = t; }
  /** แก้แถวในรายการทันทีหลังบันทึก (ไม่ต้องโหลดรายการใหม่) */
  function patchList(J) {
    if (!LIST) return;
    var P = J.data.proc, v = J.data.vendor;
    var row = { proc_id: P.proc_id, fiscal_year: P.fiscal_year, proc_no: P.proc_no, status: P.status, subject: P.subject,
      vendor: v ? v.vendor_name + (v.branch ? ' สาขา ' + v.branch : '') : '', total_amount: P.total_amount, request_date: P.request_date,
      tor_memo_date: P.tor_memo_date, updated_at: P.updated_at, updated_by: P.updated_by, folder_id: P.folder_id };
    LIST.rows = LIST.rows.filter(function (r) { return r.proc_id !== row.proc_id; });
    LIST.rows.unshift(row);
    cacheList();
  }
  var FILTERS = [['active', 'กำลังดำเนินการ'], ['draft', 'ร่าง'], ['done', 'เสร็จแล้ว'], ['void', 'ยกเลิก'], ['all', 'ทั้งหมด']];
  function filterRow(r) {
    if (FILTER === 'active') return ['requested', 'ordered', 'inspected', 'draft'].indexOf(r.status) >= 0;
    if (FILTER === 'done') return r.status === 'issued';
    if (FILTER === 'all') return true;
    return r.status === FILTER;
  }
  var filterAuto = true;
  function renderList() {
    var rows = LIST.rows.filter(function (r) { return !LISTFY || String(r.fiscal_year) === LISTFY || r.status === 'draft'; });
    // เปิดครั้งแรก: ถ้าไม่มีงานที่กำลังดำเนินการ ให้แสดงทั้งหมดแทนหน้าว่าง
    if (filterAuto) { filterAuto = false; if (FILTER === 'active' && rows.length && !rows.filter(filterRow).length) FILTER = 'all'; }
    var q = QUERY.trim().toLowerCase();
    var shown = rows.filter(filterRow).filter(function (r) {
      return !q || [r.subject, r.vendor, docNo(r), r.proc_id].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    var fys = {}; LIST.rows.forEach(function (r) { if (r.fiscal_year) fys[r.fiscal_year] = 1; }); fys[cfg().fiscal_year_current] = 1;
    var cnt = function (f) { var keep = FILTER; FILTER = f; var n = rows.filter(filterRow).length; FILTER = keep; return n; };
    var html = '<div class="p-head"><h2>งานจัดซื้อ</h2>' +
      (LIST.canCreate ? '<button class="btn primary" id="p-new">＋ สร้างงานใหม่</button>' : '') + '</div>' +
      '<div class="p-tools"><input class="search" id="p-q" type="search" placeholder="ค้นหา: ชื่องาน ผู้ขาย หรือเลขที่" value="' + esc(QUERY) + '">' +
      '<select id="p-fy" aria-label="ปีงบประมาณ">' + Object.keys(fys).sort().reverse().map(function (y) {
        return '<option value="' + esc(y) + '"' + (String(y) === LISTFY ? ' selected' : '') + '>ปีงบประมาณ ' + esc(y) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="p-tools" id="p-filters">' + FILTERS.map(function (f) {
        return '<button class="chipbtn' + (FILTER === f[0] ? ' on' : '') + '" data-f="' + f[0] + '">' + esc(f[1]) + '<span class="cnt">' + cnt(f[0]) + '</span></button>';
      }).join('') + '</div>';
    if (!shown.length) {
      html += '<div class="p-empty"><div class="big">📄</div><p>' + (rows.length ? 'ไม่พบงานที่ตรงกับตัวกรองนี้' : 'ยังไม่มีงานจัดซื้อในปีนี้') + '</p>' +
        (LIST.canCreate ? '<p>กด <b>＋ สร้างงานใหม่</b> เพื่อเริ่มงานแรก ระบบจะพาไปทีละขั้น</p>' : '') + '</div>';
    } else {
      html += '<div class="p-list">' + shown.map(function (r) {
        var idx = META.statusOrder.indexOf(r.status);
        var dots = '<span class="dots" title="ความคืบหน้า">' + [0, 1, 2, 3, 4].map(function (i) { return '<i class="' + (r.status !== 'void' && i <= idx ? 'on' : '') + '"></i>'; }).join('') + '</span>';
        return '<div class="p-card" tabindex="0" data-id="' + esc(r.proc_id) + '"><div><div>' + stChip(r.status) + ' <span class="m">' +
          (docNo(r) ? 'เลขที่ ' + esc(docNo(r)) : 'ยังไม่มีเลขที่') + '</span></div><div class="t">' + esc(r.subject || '(ยังไม่ได้ตั้งชื่องาน)') + '</div>' +
          '<div class="m">' + esc(r.vendor || 'ยังไม่ได้เลือกผู้ขาย') + '</div></div>' +
          '<div class="r"><div class="amt">' + (num(r.total_amount) ? money(r.total_amount) + ' ฿' : '—') + '</div><div>' + dots + '</div>' +
          '<div class="m">แก้ล่าสุด ' + esc(String(r.updated_at || '').slice(0, 16)) + '</div></div></div>';
      }).join('') + '</div>';
    }
    html += '<div class="p-foot muted small"><span id="p-note">' + (listBusy ? 'กำลังอัปเดต…' : '') + '</span>' +
      (keep() ? ' <span>ข้อมูลงานถูกเก็บไว้ในเครื่องนี้เพื่อให้เปิดได้เร็ว · <a href="#" id="p-clear">ล้างข้อมูลในเครื่องนี้</a></span>' : '') + '</div>';
    var hadFocus = document.activeElement && document.activeElement.id === 'p-q', selS = hadFocus ? document.activeElement.selectionStart : 0;
    $('proc-list').innerHTML = html;
    if (hadFocus) { var qi = $('p-q'); qi.focus(); qi.setSelectionRange(selS, selS); }
    if ($('p-clear')) $('p-clear').onclick = function (e) {
      e.preventDefault();
      clearLocal().then(function () { toast('ล้างข้อมูลงานที่เก็บในเครื่องนี้แล้ว'); });
    };
    if ($('p-new')) $('p-new').onclick = function () { newJob(); };
    var qt; $('p-q').oninput = function () { var v = this.value; clearTimeout(qt); qt = setTimeout(function () { QUERY = v; renderList(); var i = $('p-q'); i.focus(); i.setSelectionRange(v.length, v.length); }, 200); };
    $('p-fy').onchange = function () { LISTFY = this.value; renderList(); };
    $('p-filters').onclick = function (e) { var b = e.target.closest('[data-f]'); if (b) { FILTER = b.getAttribute('data-f'); renderList(); } };
    var open = function (e) { var c = e.target.closest('.p-card'); if (c) openJob(c.getAttribute('data-id')); };
    $('proc-list').querySelector('.p-list') && ($('proc-list').querySelector('.p-list').onclick = open);
    $('proc-list').onkeydown = function (e) { if (e.key === 'Enter' && e.target.classList.contains('p-card')) open(e); };
  }

  function missing(forms) {
    var pl = toPayload(), P = pl.proc, out = [], seen = {};
    var cm = function (k) { return E.data.committees[k].every(nz); };
    var sp = function (s) { return pl.specs.some(function (x) { return x.section === s; }); };
    var special = {
      '@tor3': function () { return cm('TOR'); }, '@ic3': function () { return cm('INSPECT'); },
      '@items': function () { return pl.items.length && pl.items.every(function (i) { return nz(i.description) && num(i.qty) > 0 && nz(i.unit_price) && nz(i.unit); }); },
      '@vendor': function () { return nz(P.vendor_id) && E.data.vendor; },
      '@bg': function () { return sp('background'); }, '@obj': function () { return sp('objective'); }, '@spec': function () { return sp('spec'); },
      '@proc_no': function () { return nz(P.proc_no); }, '@inspect_no': function () { return nz(P.inspect_order_no); }
    };
    forms.forEach(function (f) {
      (META.rules[f] || []).forEach(function (r) {
        var ok, key, label, step;
        if (r.charAt(0) === '@') { ok = special[r](); key = r; label = META.special[r][0]; step = META.special[r][1]; }
        else { var x = r.split('|'); key = x[0]; label = x[1]; step = Number(x[2]); ok = nz(P[key]); }
        if (!ok && !seen[key]) { seen[key] = 1; out.push({ form: f, key: key, label: label, step: step }); }
      });
    });

  }

    PROC_ALL_FORMS().forEach(function (f) { (META.rules[f] || []).forEach(function (r) { var x = r.split('|'); if (x[2] && Number(x[2]) === step) keys[x[0]] = 1; }); });

  /**
   * เปิดงาน: ถ้ามีข้อมูลที่เก็บไว้ในเครื่อง แสดงทันที (ล็อกปุ่มบันทึกไว้ชั่วครู่) แล้วตรวจกับเซิร์ฟเวอร์

  var openSeq = 0;

    var seq = ++openSeq;

          canEdit: c.canEdit, canVoid: c.canVoid, folderUrl: c.folderUrl, isNew: false, ver: 0, stale: true };

        busyOff();

        if (d.hist) HIST = d.hist;

        var cur = E && E.data.proc.proc_id === id && E.stale ? E : null;

          cur.stale = false; cur.docs = fresh.docs; cur.canEdit = fresh.canEdit; cur.canVoid = fresh.canVoid; cur.folderUrl = fresh.folderUrl;
          renderTop(); renderAct(); renderSide(); cacheJob(cur);

            buttons: [{ label: 'แก้ต่อ (บันทึกไม่ได้)', value: false }, { label: 'โหลดข้อมูลล่าสุด', value: true, cls: 'primary' }] })
            .then(function (v) { if (v) { cur.dirty = false; idb.del('proc:job:' + id); openJob(id, cur.step); } });
        } else {
          var step = cur ? cur.step : stepFor(fresh.data.proc, fresh.data.items, keepStep);

  // ---------- ราคา/ยี่ห้อล่าสุดจากงานในระบบใหม่ ----------
  var HIST = null;
  function loadHist() {
    return run('apiProcPriceHistory').then(function (h) { HIST = h || {}; }).catch(function () { HIST = HIST || {}; });
  }
  function itemKey(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function histOf(row) {
    if (!HIST || !row) return null;
    var h = (row.item_code && HIST['C:' + row.item_code]) || HIST['N:' + itemKey(row.description)] || null;
    return h && h.proc_id === E.data.proc.proc_id ? null : h; // ไม่นับงานนี้เอง
  }
  /** เติมหน่วย/ราคา/ยี่ห้อล่าสุด เฉพาะช่องที่ว่าง — คืน true ถ้ามีการเติม */
  function fillFromHistory(row) {
    var h = histOf(row); if (!h) { row._hint = ''; return false; }
    var did = false;
    if (!nz(row.unit) && h.unit) { row.unit = h.unit; did = true; }
    if (!nz(row.unit_price)) { row.unit_price = String(h.price); did = true; }
    if (!nz(row.brand) && h.brand) { row.brand = h.brand; did = true; }
    if (!nz(row.model) && h.model) { row.model = h.model; did = true; }
    row._hint = 'ราคาล่าสุด ' + money(h.price) + ' บาท' + (h.unit ? '/' + h.unit : '') + (h.brand ? ' · ยี่ห้อ ' + h.brand : '') +
      (/\//.test(h.job) ? ' · งาน ' : ' · งานร่าง ') + h.job + (h.date ? ' (' + thDate(h.date) + ')' : '') + (did ? ' — เติมให้แล้ว แก้ได้' : '');
    return did;
  }

      html: '<div class="fg">' + VF.map(function (f) {
        return '<div class="fld' + (f[0] === 'vendor_name' || f[0] === 'address' ? ' wide' : '') + '"><label>' + esc(f[1]) + (f[3] ? '<span class="req">*</span>' : '') + '</label><input class="p-in" data-vf="' + f[0] + '" placeholder="' + esc(f[2]) + '" value="' + esc(v[f[0]] || '') + '"></div>';
      }).join('') + '</div><p class="muted small">ข้อมูลนี้ใช้ในใบสั่งซื้อ หนังสือแจ้ง และประกาศผู้ชนะ</p>',
      buttons: [{ label: 'ยกเลิก', value: false }, { label: 'บันทึกผู้ขาย', value: true, cls: 'primary' }],
      collect: function (bg) {
        var o = { vendor_id: v.vendor_id || '' };
        Array.prototype.forEach.call(bg.querySelectorAll('[data-vf]'), function (i) { o[i.getAttribute('data-vf')] = i.value.trim(); });
        if (!o.vendor_name) { modalErr(bg, 'กรุณากรอกชื่อผู้ขาย'); return false; }
        var tax = o.tax_id.replace(/\D/g, '');
        if (o.tax_id && tax.length !== 13) { modalErr(bg, 'เลขประจำตัวผู้เสียภาษีต้องมี 13 หลัก (ตอนนี้มี ' + tax.length + ' หลัก) — หรือเว้นว่างไว้ก่อน'); return false; }
        if (o.postcode && !/^\d{5}$/.test(o.postcode.replace(/\D/g, ''))) { modalErr(bg, 'รหัสไปรษณีย์ต้องเป็นตัวเลข 5 หลัก'); return false; }
        return run('apiProcSaveVendor', o);
      }
    }).then(function (row) {
      if (!row || row === true) return;
      var t = A.S.ref.vendors, idx = t.cols.indexOf('vendor_id');
      var arr = t.cols.map(function (c) { return row[c] === undefined ? '' : row[c]; });
      var at = -1; t.rows.forEach(function (r, i) { if (r[idx] === row.vendor_id) at = i; });
      if (at >= 0) t.rows[at] = arr; else t.rows.push(arr);
      E.data.vendor = row; setP('vendor_id', row.vendor_id); renderStep(); toast('บันทึกผู้ขาย ' + row.vendor_id + ' แล้ว');
    });
  }
  function copyFromJob() {
    var go = function () {
      var rows = LIST.rows.filter(function (r) { return r.proc_id !== E.data.proc.proc_id; });
      modal({ title: 'คัดลอกจากงานเดิม', wide: true,
        html: '<input class="p-in" id="cp-q" placeholder="ค้นหาชื่องาน ผู้ขาย หรือเลขที่"><div id="cp-list" style="max-height:260px;overflow:auto;margin:8px 0"></div>' +
          '<div class="lb" style="font-weight:600">คัดลอกส่วนใด</div><div class="radio-row" id="cp-what">' +
          [['tor', 'ข้อความ TOR', 1], ['items', 'รายการพัสดุ', 1], ['cmte', 'กรรมการทั้ง 2 ชุด', 0], ['proj', 'โครงการ งบ หน่วยงาน', 1], ['cond', 'เงื่อนไข (ส่งมอบ ประกัน)', 1], ['vendor', 'ผู้ขาย', 0]]
            .map(function (o) { return '<label><input type="checkbox" value="' + o[0] + '"' + (o[2] ? ' checked' : '') + '> ' + o[1] + '</label>'; }).join('') + '</div>' +
          '<p class="muted small">ข้อมูลที่คัดลอกจะทับช่องเดิมในงานนี้ ยังไม่บันทึกจนกว่าจะกด "บันทึกร่าง"</p>',
        buttons: [{ label: 'ยกเลิก', value: false }, { label: 'คัดลอก', value: true, cls: 'primary' }],
        onOpen: function (bg) {
          var sel = '';
          var draw = function () {
            var q = bg.querySelector('#cp-q').value.trim().toLowerCase();
            var hit = rows.filter(function (r) { return !q || [r.subject, r.vendor, docNo(r)].join(' ').toLowerCase().indexOf(q) >= 0; }).slice(0, 40);
            bg.querySelector('#cp-list').innerHTML = hit.length ? hit.map(function (r) {
              return '<div class="p-card" style="padding:8px 12px;margin-bottom:6px' + (sel === r.proc_id ? ';border-color:var(--brand);background:#eef3fa' : '') + '" data-id="' + esc(r.proc_id) + '"><div><div class="t" style="font-size:15px">' + esc(r.subject || '-') +
                '</div><div class="m">' + esc(docNo(r) || r.proc_id) + ' · ' + esc(r.vendor || '') + '</div></div><div class="r">' + stChip(r.status) + '</div></div>';
            }).join('') : '<p class="muted">ไม่พบงาน</p>';
          };
          bg.querySelector('#cp-q').oninput = draw;
          bg.querySelector('#cp-list').onclick = function (e) { var c = e.target.closest('[data-id]'); if (c) { sel = c.getAttribute('data-id'); bg.setAttribute('data-sel', sel); draw(); } };
          draw();
        },
        collect: function (bg) {
          var id = bg.getAttribute('data-sel'); if (!id) { toast('เลือกงานต้นแบบก่อน', true); return false; }
          return { id: id, what: Array.prototype.filter.call(bg.querySelectorAll('#cp-what input'), function (i) { return i.checked; }).map(function (i) { return i.value; }) };
        }
      }).then(function (c) {
        if (!c) return;
        busyOn('กำลังคัดลอก…');
        run('apiProcGet', c.id, { log: false }).then(function (d) {
          busyOff();
          var src = fromServer(d), w = function (k) { return c.what.indexOf(k) >= 0; };
          if (w('tor')) E.data.specs = src.specs;
          if (w('items')) E.data.items = src.items.length ? src.items : [blankItem()];
          if (w('cmte')) E.data.committees = src.committees;
          if (w('proj')) ['project_name', 'admin_group', 'responsible_unit', 'budget_type', 'budget_source', 'reason', 'dept'].forEach(function (k) { E.data.proc[k] = src.proc[k] || ''; });
          if (w('cond')) ['delivery_days', 'price_validity_days', 'warranty_years', 'repair_days', 'contract_sign_days', 'price_source', 'item_mode', 'po_line_unit'].forEach(function (k) { E.data.proc[k] = src.proc[k] || E.data.proc[k]; });
          if (w('vendor') && src.vendor) { E.data.vendor = src.vendor; E.data.proc.vendor_id = src.vendor.vendor_id; }
          markDirty('คัดลอกจาก ' + (docNo(d.proc) || d.proc.proc_id));
          renderStep(); toast('คัดลอกแล้ว — ตรวจทานแล้วกด "บันทึกร่าง"');
        }).catch(function (e) { busyOff(); toast(e.message, true); });
      });
    };
    if (LIST) go(); else { busyOn('กำลังโหลดรายการงาน…'); refreshList().then(function () { busyOff(); if (LIST) go(); }); }
  }
  function showLog() {
    var draw = function (log) {
      return '<div class="loglist">' + (log.length ? log.map(function (l) {
        return '<div><b>' + esc(l.action) + '</b> <span class="muted">' + esc(String(l.at).slice(0, 16)) + ' · ' + esc(l.by_email) + '</span>' +
          (l.from_status !== l.to_status && l.to_status ? ' · ' + stChip(l.to_status) : '') + (l.note ? '<div class="muted small">' + esc(l.note) + '</div>' : '') + '</div>';
      }).join('') : '<p class="muted">ยังไม่มีประวัติ</p>') + '</div>';
    };
    var J = E;
    modal({ title: 'ประวัติของงานนี้', wide: true, html: '<div id="log-box"><div class="loading"><div class="spinner"></div><div>กำลังโหลดประวัติ…</div></div></div>' });
    run('apiProcLog', J.data.proc.proc_id).then(function (log) {
      J.log = log; var b = $('log-box'); if (b) b.innerHTML = draw(log);
    }).catch(function (e) { var b = $('log-box'); if (b) b.innerHTML = '<div class="banner bad">' + esc(e.message) + '</div>'; });
  }
  function voidJob() {
    modal({ title: 'ยกเลิกงานนี้?', html: '<p>ข้อมูลและเอกสารจะยังอยู่ แต่สถานะเป็น "ยกเลิก" และเลขที่ที่ออกไปแล้วจะไม่ถูกนำกลับมาใช้</p>' +
      '<label class="lb">เหตุผลที่ยกเลิก<span class="req">*</span></label><textarea class="p-in" id="void-r" placeholder="เช่น ผู้ขายไม่สามารถส่งของได้"></textarea>',
      buttons: [{ label: 'ไม่ยกเลิก', value: false }, { label: 'ยืนยันยกเลิกงาน', value: true, cls: 'danger' }],
      collect: function (bg) { var r = bg.querySelector('#void-r').value.trim(); if (!r) { toast('กรอกเหตุผลก่อน', true); return false; } return r; }
    }).then(function (reason) {
      if (!reason) return;
      var id = E.data.proc.proc_id;
      run('apiProcVoid', id, reason).then(function () { toast('ยกเลิกงานแล้ว'); E.dirty = false; idb.del('proc:job:' + id); LIST && (LIST.rows.forEach(function (r) { if (r.proc_id === id) r.status = 'void'; }), cacheList()); openJob(id, 1); })
        .catch(function (e) { toast(e.message, true); });
    });
  }

  window.ProcUI = { show: show, isDirty: function () { return !!(E && (E.dirty || E.saving)); } };
})();
</script>
